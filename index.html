<!-- TOKOCPS DISCORD POPUP -->
<style>
.discord-overlay {
  position: fixed;
  inset: 0;
  z-index: 999999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(0,0,0,.88);
  backdrop-filter: blur(13px);
  -webkit-backdrop-filter: blur(13px);
}

.discord-overlay.show {
  display: flex;
  animation: discordFade .35s ease;
}

.discord-popup {
  width: 100%;
  max-width: 520px;
  padding: 27px;
  border-radius: 25px;
  background: #192433;
  border: 1px solid #344256;
  color: #f5f7fb;
  box-shadow: 0 25px 80px rgba(0,0,0,.5);
  animation: discordSlide .4s ease;
}

.discord-heading {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 22px;
}

.discord-icon {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  color: #5865F2;
}

.discord-heading h2 {
  font-size: 23px;
  line-height: 1.3;
  margin: 0;
  font-weight: 800;
}

.discord-desc {
  color: #9eacbf;
  font-size: 15px;
  line-height: 1.7;
  margin-bottom: 23px;
}

.discord-benefit {
  display: flex;
  align-items: center;
  gap: 13px;
  margin: 17px 0;
  font-size: 15px;
}

.discord-check {
  color: #5865F2;
  font-size: 23px;
  font-weight: bold;
}

.discord-buttons {
  display: grid;
  gap: 13px;
  margin-top: 29px;
}

.discord-join,
.discord-later {
  width: 100%;
  min-height: 57px;
  border-radius: 17px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: .2s;
}

.discord-join {
  color: #8290ff;
  background: transparent;
  border: 2px solid #5865F2;
}

.discord-join:active {
  background: #5865F2;
  color: white;
  transform: scale(.98);
}

.discord-later {
  color: #f5f7fb;
  background: transparent;
  border: 2px solid #3d4b60;
}

.discord-later:active {
  background: #29374a;
}

@keyframes discordFade {
  from {opacity:0}
  to {opacity:1}
}

@keyframes discordSlide {
  from {opacity:0; transform:translateY(25px) scale(.96)}
  to {opacity:1; transform:translateY(0) scale(1)}
}

@media(max-width:480px) {
  .discord-popup {
    padding: 24px 21px;
  }
  .discord-heading h2 {
    font-size: 20px;
  }
}
</style>

<div class="discord-overlay" id="tokocpsDiscordPopup">
  <div class="discord-popup">

    <div class="discord-heading">
      <svg class="discord-icon" viewBox="0 0 127.14 96.36"
        xmlns="http://www.w3.org/2000/svg" fill="currentColor">
        <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.88 97.68 97.68 0 0 0-29.07 0A72.37 72.37 0 0 0 45.68 0a105.89 105.89 0 0 0-26.25 8.09C2.8 32.65-1.7 56.6.55 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.9-11.18 68.42 68.42 0 0 1-10.86-5.18c.91-.67 1.8-1.37 2.65-2.08a75.75 75.75 0 0 0 64.47 0c.87.71 1.75 1.41 2.65 2.08a68.68 68.68 0 0 1-10.88 5.19 77 77 0 0 0 6.9 11.17 105.25 105.25 0 0 0 32.18-16.14c2.64-27.38-4.52-51.11-19.03-72.15ZM42.45 65.69c-6.27 0-11.45-5.72-11.45-12.75s5.08-12.75 11.45-12.75 11.56 5.77 11.45 12.75c0 7.03-5.08 12.75-11.45 12.75Zm42.24 0c-6.27 0-11.45-5.72-11.45-12.75s5.08-12.75 11.45-12.75 11.56 5.77 11.45 12.75c0 7.03-5.02 12.75-11.45 12.75Z"/>
      </svg>
      <h2>Gabung Komunitas Discord</h2>
    </div>

    <div class="discord-desc">
      Bergabung dengan komunitas TOKOCPS di Discord untuk mendapatkan informasi terbaru:
    </div>

    <div class="discord-benefit">
      <span class="discord-check">✓</span>
      Update harga jual & beli terbaru
    </div>

    <div class="discord-benefit">
      <span class="discord-check">✓</span>
      Info promo dan diskon terbaru
    </div>

    <div class="discord-benefit">
      <span class="discord-check">✓</span>
      Informasi restock lebih dulu
    </div>

    <div class="discord-buttons">
      <button class="discord-join" onclick="tokocpsJoinDiscord()">
        JOIN DISCORD
      </button>

      <button class="discord-later" onclick="tokocpsCloseDiscord()">
        NANTI SAJA
      </button>
    </div>

  </div>
</div>

<script>
(function() {
  const popup = document.getElementById("tokocpsDiscordPopup");

  if (!sessionStorage.getItem("tokocpsDiscordSeen")) {
    setTimeout(() => {
      popup.classList.add("show");
    }, 500);
  }
})();

function tokocpsCloseDiscord() {
  document.getElementById("tokocpsDiscordPopup")
    .classList.remove("show");

  sessionStorage.setItem("tokocpsDiscordSeen", "yes");
}

function tokocpsJoinDiscord() {
  window.open(
    "https://discord.gg/INVITEKAMU",
    "_blank"
  );

  tokocpsCloseDiscord();
}
</script>
